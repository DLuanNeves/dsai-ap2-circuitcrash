name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check
      - name: Formato
        run: uv run ruff format --check
      - name: Tipos
        run: uv run mypy
      - name: Testes
        run: uv run pytest